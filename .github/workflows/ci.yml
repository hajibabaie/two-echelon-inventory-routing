name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without the gurobi extra
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test (Gurobi tests are skipped, the license is not on the runner)
        run: pytest -q -m "not gurobi"
